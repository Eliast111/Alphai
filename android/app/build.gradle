plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alphai.ultra'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alphai.ultra'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        buildConfigField "String", "WEB_APP_URL",
            '"https://alphai-ultra.veniciotiago6.workers.dev/"'
    }

    buildFeatures {
        buildConfig true
    }
}
