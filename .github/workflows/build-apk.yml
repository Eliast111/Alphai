ame: Build AlphAI Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/AlphaI-Ultra.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaI-ULTRA-APK
          path: android/app/build/outputs/apk/debug/AlphaI-Ultra.apk
          if-no-files-found: error
